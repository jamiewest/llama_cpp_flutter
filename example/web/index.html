<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="llama_cpp_flutter_example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>llama_cpp_flutter_example</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    llama_cpp_flutter's web runtime expects `globalThis.Wllama` to be set
    before a model is loaded. The wllama JS version must match the
    wllama.wasm asset bundled with the plugin (WLLAMA_VERSION in the
    plugin's tool/versions.env); the plugin passes its own wasm path to
    this constructor.

    jsDelivr serves CORS headers, so this import keeps working when the page
    is served cross-origin isolated (COOP/COEP) for multi-threading.
  -->
  <!--
    Cross-origin isolation shim for hosts that can't set response headers
    (e.g. GitHub Pages): a service worker injects COOP/COEP and reloads the
    page once. On servers that already send the headers it does nothing.
    Without isolation wllama silently falls back to a single thread.
  -->
  <script src="coi-serviceworker.min.js"></script>
  <script type="module">
    import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.5.1/esm/index.min.js';
    globalThis.Wllama = Wllama;
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
