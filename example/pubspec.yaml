name: llama_cpp_flutter_example
description: >-
  Demo chat app for llama_cpp_flutter: flutter_ai_toolkit chat UI over a
  local GGUF model with configurable model + agent, on macOS/iOS and web.
  Also serves as CI's link-level smoke test against the vendored
  llama.xcframework.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  agents: ^1.5.0
  extensions: ^0.5.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_ai_toolkit: ^1.0.0
  llama_cpp_flutter:
    path: ../
  path_provider: ^2.1.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
