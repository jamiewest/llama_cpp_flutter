name: llama_cpp_flutter
description: >-
  On-device LLM inference for Flutter: llama.cpp with Metal on iOS/macOS,
  wllama on web. Streaming sessions, chat formats, model downloads, and
  optional agents integration.
version: 0.4.0
repository: https://github.com/jamiewest/llama_cpp_flutter
topics:
  - llm
  - llama-cpp
  - gguf
  - on-device-ai
  - local-ai

# Floor set by the `agents` dependency (^3.11.5); this package's own code
# needs only Dart 3.9. Flutter 3.41.7 is the first stable with Dart 3.11.5.
environment:
  sdk: ^3.11.5
  flutter: ">=3.41.7"

dependencies:
  agents: ^1.5.0
  characters: ^1.4.1
  extensions: ^0.5.0
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  meta: ^1.16.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  pigeon: ^26.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LlamaCppFlutterPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: LlamaCppFlutterPlugin
        sharedDarwinSource: true
  assets:
    - lib/assets/wasm/
