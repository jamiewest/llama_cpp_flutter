name: llama_cpp_flutter
description: >-
  On-device LLM inference for Flutter: llama.cpp with Metal on iOS/macOS,
  wllama on web. Streaming sessions, chat formats, model downloads, and
  memory-aware multi-agent orchestration.
version: 0.6.1
repository: https://github.com/jamiewest/llama_cpp_flutter
topics:
  - llm
  - llama-cpp
  - gguf
  - on-device-ai
  - local-ai

# Floor set by this package's own code (null-aware elements, Dart 3.8) and
# its `pigeon` dev dependency (^3.9.0). Flutter 3.35.0 is the first stable
# with Dart 3.9. Direct runtime dependencies all sit below this.
environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  characters: ^1.4.1
  extensions: ^0.5.0
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  meta: ^1.16.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  pigeon: ^26.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LlamaCppFlutterPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: LlamaCppFlutterPlugin
        sharedDarwinSource: true
  assets:
    - lib/assets/wasm/
