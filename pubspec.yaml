name: llama_flutter
description: >-
  On-device LLM inference for Flutter, backed by llama.cpp: a vendored
  xcframework with a Pigeon bridge on iOS/macOS, wllama on web, plus GGUF chat
  clients for the agents framework and memory-aware multi-agent orchestration
  over one loaded model.
version: 0.1.0
repository: https://github.com/jamiewest/local_agents

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  agents: ^1.5.0
  extensions: ^0.5.0
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LlamaFlutterPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: LlamaFlutterPlugin
        sharedDarwinSource: true
  assets:
    - lib/assets/wasm/
