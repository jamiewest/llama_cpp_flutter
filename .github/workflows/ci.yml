name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Browser-only suites: `flutter test` skips @TestOn('browser') files,
      # and OPFS-backed storage has no VM equivalent to stand in for it.
      - run: >-
          flutter test --platform chrome
          test/artifact_store_web_test.dart
          test/web_runtime_smoke_test.dart
      - run: flutter analyze
        working-directory: example
      - run: flutter test
        working-directory: example

  # The staging-ABI tripwire: fails when llama.cpp's src/llama-ext.h no
  # longer declares what darwin/Classes/LlamaExtShim.cpp re-declares.
  abi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tool/check_llama_ext_abi.sh

  # Link-time backstop: pod install fetches the pinned xcframework and the
  # app link resolves every llama.cpp symbol the plugin references.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --debug
        working-directory: example
